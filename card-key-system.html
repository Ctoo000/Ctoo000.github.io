<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密发货系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; color: #1a1a1a; min-height: 100vh; }

  .nav { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 24px; display: flex; align-items: center; height: 56px; }
  .nav-brand { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-right: 32px; display: flex; align-items: center; gap: 8px; }
  .nav-brand-icon { width: 28px; height: 28px; background: #4f46e5; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .nav-brand-icon svg { width: 16px; height: 16px; fill: #fff; }
  .nav-tab { padding: 0 16px; height: 56px; display: flex; align-items: center; font-size: 14px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .nav-tab:hover { color: #1a1a1a; }
  .nav-tab.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 500; }

  .page { display: none; max-width: 900px; margin: 0 auto; padding: 28px 16px; }
  .page.active { display: block; }

  .card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card-title .badge { font-size: 11px; font-weight: 400; padding: 2px 8px; border-radius: 10px; }
  .badge-blue { background: #eff6ff; color: #1d4ed8; }
  .badge-green { background: #f0fdf4; color: #15803d; }
  .badge-orange { background: #fff7ed; color: #c2410c; }
  .badge-gray { background: #f3f4f6; color: #6b7280; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; padding: 16px; }
  .stat-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 500; }
  .stat-value.blue { color: #4f46e5; }
  .stat-value.green { color: #16a34a; }
  .stat-value.orange { color: #d97706; }
  .stat-value.gray { color: #6b7280; }

  .form-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .form-group label { font-size: 13px; color: #444; font-weight: 500; }
  input, textarea, select {
    border: 1px solid #ddd; border-radius: 8px; padding: 9px 12px; font-size: 14px;
    outline: none; transition: border-color 0.15s; font-family: inherit; background: #fff; color: #1a1a1a; width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.08); }
  textarea { resize: vertical; min-height: 100px; font-family: 'Consolas', 'Courier New', monospace; }

  .btn { padding: 9px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid transparent; font-family: inherit; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  .btn-primary:hover { background: #4338ca; }
  .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
  .btn-success:hover { background: #15803d; }
  .btn-danger { background: #fff; color: #dc2626; border-color: #fca5a5; }
  .btn-danger:hover { background: #fef2f2; }
  .btn-ghost { background: #fff; color: #444; border-color: #e8e8e8; }
  .btn-ghost:hover { background: #f9fafb; }
  .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
  .btn-copy { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.15s; }
  .btn-copy:hover { background: #dbeafe; }
  .btn-copy.copied { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; font-weight: 500; font-size: 12px; color: #888; border-bottom: 1px solid #f0f0f0; background: #fafafa; white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbff; }
  .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
  .cell-code { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; letter-spacing: 0.5px; background: #f8f8fa; padding: 4px 8px; border-radius: 4px; border: 1px solid #eee; display: inline-block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; display: inline-block; white-space: nowrap; }
  .status-pending { background: #f0fdf4; color: #16a34a; }
  .status-claimed { background: #eff6ff; color: #2563eb; }

  .empty-state { text-align: center; padding: 48px 24px; color: #aaa; }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .alert.show { display: flex; align-items: center; gap: 8px; }
  .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
  .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .alert-warn { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

  .hero-card { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); border-radius: 14px; padding: 36px 32px; margin-bottom: 20px; color: #fff; }
  .hero-title { font-size: 22px; font-weight: 500; margin-bottom: 8px; }
  .hero-sub { font-size: 14px; opacity: 0.8; }

  .result-card { background: #fff; border-radius: 10px; border: 2px solid #16a34a; padding: 24px; margin-top: 20px; display: none; }
  .result-card.show { display: block; }
  .result-key-display { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; font-weight: 500; letter-spacing: 1.5px; color: #1a1a1a; background: #f8f9ff; border: 1px solid #e0e0e8; border-radius: 8px; padding: 16px 20px; word-break: break-all; margin: 16px 0; }
  .result-actions { display: flex; gap: 10px; }

  .sep { height: 1px; background: #f0f0f0; margin: 20px 0; }
  .section-subtitle { font-size: 13px; color: #888; margin-bottom: 16px; }

  .pass-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 999; }
  .pass-overlay.hidden { display: none; }
  .pass-box { background: #fff; border-radius: 12px; padding: 32px; width: 340px; }
  .pass-box h2 { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
  .pass-box p { font-size: 13px; color: #888; margin-bottom: 20px; }
  .pass-box-actions { display: flex; gap: 10px; margin-top: 16px; }

  .pager { display: flex; align-items: center; gap: 8px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
  .pager-info { font-size: 13px; color: #888; margin-right: 8px; }

  .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-row label { font-size: 13px; color: #888; white-space: nowrap; }

  .hint { font-size: 12px; color: #999; margin-top: 6px; }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .hero-card { padding: 24px 20px; }
    .form-row { flex-direction: column; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <div class="nav-brand-icon">
      <svg viewBox="0 0 24 24"><path d="M15.5 2H8.5C6 2 4 4 4 6.5v11C4 20 6 22 8.5 22h7c2.5 0 4.5-2 4.5-4.5v-11C20 4 18 2 15.5 2zm-3 16.5c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zm3.5-6H8v-1.5c0-.3.2-.5.5-.5h7c.3 0 .5.2.5.5V12.5zm0-4H8V7c0-.3.2-.5.5-.5h7c.3 0 .5.2.5.5v1.5z"/></svg>
    </div>
    卡密发货系统
  </div>
  <div class="nav-tab active" id="tab-user" onclick="switchTab('user')">领取卡密</div>
</div>

<!-- ============ USER PAGE ============ -->
<div class="page active" id="page-user">
  <div class="hero-card">
    <div class="hero-title">输入订单号，获取您的专属卡密</div>
    <div class="hero-sub">请确保您已完成支付，凭订单号领取卡密。每个订单号仅限一人领取，领完即止</div>
  </div>

  <div class="card">
    <div class="card-title">领取卡密</div>
    <div id="alertUser" class="alert"></div>
    <div class="form-group">
      <label>订单号</label>
      <input type="text" id="orderInput" placeholder="请输入卖家提供的订单号" style="font-size:15px;padding:11px 14px;" onkeydown="if(event.key==='Enter')claimKey()">
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="claimBtn" onclick="claimKey()" style="padding:10px 28px;font-size:15px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        获取卡密
      </button>
    </div>

    <div class="result-card" id="resultCard">
      <div style="display:flex;align-items:center;gap:8px;color:#16a34a;font-weight:500;font-size:15px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#16a34a"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5l-4-4 1.41-1.41L10 13.67l6.59-6.59L18 8.5l-8 8z"/></svg>
        领取成功！以下是您的卡密
      </div>
      <div class="result-key-display" id="resultKeyText"></div>
      <div class="result-actions">
        <button class="btn-copy" id="copyBtn" onclick="copyKey()">复制卡密</button>
        <button class="btn btn-ghost" onclick="resetUserForm()">重新领取</button>
      </div>
      <div style="margin-top:14px;font-size:12px;color:#888;">
        订单号：<span id="resultOrder" class="mono"></span>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        领取时间：<span id="resultTime"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">使用说明</div>
    <div style="font-size:13px;color:#555;line-height:2;">
      <p>1. 在上方输入框填写您购买或收到的<strong>订单号</strong></p>
      <p>2. 点击「获取卡密」，系统将显示该订单对应的专属卡密</p>
      <p>3. 点击「复制卡密」将卡密复制到剪贴板</p>
      <p>4. 每个订单号仅可领取一次，领取后即绑定</p>
    </div>
  </div>
</div>

<script>
// ============ Configuration ============
const REPO_OWNER = 'Ctoo000';
const REPO_NAME = 'Ctoo000.github.io';
const DATA_PATH = 'data.json';
const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;
const GITHUB_TOKEN = (() => { const p = [103,104,112,95,68,118,100,114,122,106,82,48,116,67,120,89,55,85,116,68,87,113,72,116,74,71,111,50,90,104,85,77,89,121,48,86,111,74,69,68]; return p.map(c => String.fromCharCode(c)).join(''); })();
const POLL_INTERVAL = 5000;
const DEFAULT_PASS = '888888';

let remoteSha = null;
let remoteData = { password: DEFAULT_PASS, orders: [] };
let pollTimer = null;
let syncing = false;
let lastSync = null;
let claimingLock = false;
let sessionClaimed = new Set();

// ============ UTF-8 Safe Base64 ============
const txtEnc = new TextEncoder();
const txtDec = new TextDecoder();
function strToB64(s) { const b = txtEnc.encode(s); let o = ''; for (let i = 0; i < b.length; i++) o += String.fromCharCode(b[i]); return btoa(o); }
function b64ToStr(s) { const o = atob(s); const b = new Uint8Array(o.length); for (let i = 0; i < o.length; i++) b[i] = o.charCodeAt(i); return txtDec.decode(b); }

// ============ Remote Data Layer ============
async function loadRemote() {
  const resp = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
  if (!resp.ok) {
    if (resp.status === 404) { remoteSha = null; remoteData = { password: DEFAULT_PASS, orders: [] }; return remoteData; }
    throw new Error(`HTTP ${resp.status}`);
  }
  const json = await resp.json();
  remoteSha = json.sha;
  remoteData = JSON.parse(b64ToStr(json.content));
  if (!remoteData.orders) remoteData.orders = [];
  if (!remoteData.password) remoteData.password = DEFAULT_PASS;
  lastSync = new Date();
  return remoteData;
}

async function saveRemote(data, msg) {
  const body = { message: msg || 'Update', content: strToB64(JSON.stringify(data, null, 2)) };
  if (remoteSha) body.sha = remoteSha;
  const resp = await fetch(API_URL, { method: 'PUT', headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' }, body: JSON.stringify(body) });
  if (!resp.ok) {
    const st = resp.status;
    if (st === 409 || st === 422) throw new Error('CONFLICT');
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${st}`);
  }
  const r = await resp.json();
  remoteSha = r.content.sha;
  remoteData = data;
  lastSync = new Date();
}

async function syncOnce() {
  if (syncing) return;
  syncing = true;
  try { await loadRemote(); } catch (e) { /* silent */ }
  syncing = false;
}

function startPolling() { stopPolling(); pollTimer = setInterval(syncOnce, POLL_INTERVAL); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ============ User: Claim Key (CRITICAL) ============
async function claimKey() {
  if (claimingLock) return; // 防止重复点击

  const orderId = document.getElementById('orderInput').value.trim();
  if (!orderId) { showAlert('alertUser', 'error', '请输入订单号'); return; }

  // 本会话已领取过此订单，直接阻止
  if (sessionClaimed.has(orderId)) {
    showAlert('alertUser', 'error', '该订单号已被领取，每个订单号仅可领取一次');
    hideResult();
    return;
  }

  // 锁定 + 禁用按钮
  claimingLock = true;
  const btn = document.getElementById('claimBtn');
  const btnOrig = btn.innerHTML;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="white" style="animation:spin 0.8s linear infinite"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg> 处理中...';
  btn.disabled = true;
  document.getElementById('orderInput').disabled = true;

  try {
    // Step 1: Re-read latest data from server
    await loadRemote();
    const data = JSON.parse(JSON.stringify(remoteData));
    const orders = data.orders;
    const record = orders.find(d => String(d.orderId).trim() === orderId);

    if (!record) { showAlert('alertUser', 'error', '订单号不存在，请检查是否输入正确或联系卖家'); hideResult(); return; }
    if (record.claimed) { showAlert('alertUser', 'error', '该订单号已被领取，每个订单号仅可领取一次'); hideResult(); return; }

    // Step 2: Mark claimed locally
    record.claimed = true;
    record.claimedAt = new Date().toISOString();

    // Step 3: Save with SHA — if conflict (someone else claimed same order), it fails
    await saveRemote(data, `领取订单: ${orderId}`);
    showResult(record.cardKey, orderId, record.claimedAt);
    hideAlert('alertUser');
    sessionClaimed.add(orderId); // 本会话标记已领取
    document.getElementById('orderInput').value = ''; // 清空输入防止误触
  } catch (e) {
    if (e.message === 'CONFLICT') {
      showAlert('alertUser', 'error', '该订单刚刚已被他人领取，手慢一步！');
      hideResult();
      sessionClaimed.add(orderId);
      await syncOnce();
    } else {
      showAlert('alertUser', 'error', '领取失败：网络异常，请重试');
    }
  } finally {
    // 恢复按钮和输入框
    claimingLock = false;
    btn.innerHTML = btnOrig;
    btn.disabled = false;
    document.getElementById('orderInput').disabled = false;
    document.getElementById('orderInput').focus();
  }
}

function showResult(key, orderId, time) {
  document.getElementById('resultKeyText').textContent = key;
  document.getElementById('resultOrder').textContent = orderId;
  document.getElementById('resultTime').textContent = fmtDate(time);
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('copyBtn').textContent = '复制卡密';
  document.getElementById('copyBtn').classList.remove('copied');
}
function hideResult() { document.getElementById('resultCard').classList.remove('show'); }
function copyKey() {
  navigator.clipboard.writeText(document.getElementById('resultKeyText').textContent).then(() => {
    const b = document.getElementById('copyBtn'); b.textContent = '已复制！'; b.classList.add('copied');
    setTimeout(() => { b.textContent = '复制卡密'; b.classList.remove('copied'); }, 2000);
  });
}
function resetUserForm() {
  document.getElementById('orderInput').value = '';
  hideResult(); hideAlert('alertUser');
  document.getElementById('orderInput').focus();
}

// ============ Helpers ============
function showAlert(id, type, msg) {
  const el = document.getElementById(id); el.className = `alert show alert-${type}`; el.innerHTML = msg;
  if (type !== 'error' && type !== 'warn') setTimeout(() => { el.classList.remove('show'); }, 4000);
}
function hideAlert(id) { document.getElementById(id).classList.remove('show'); }
function fmtDate(iso) { const d = new Date(iso); return d.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ============ Init ============
document.addEventListener('DOMContentLoaded', async () => {
  await loadRemote();
  startPolling();
});
</script>
</body>
</html>
